[backdrop]
enabled = true

[bar.default]
background_opacity = 0.59999998658895493
capsule_opacity = 0.63999998569488525
capsule_radius = 6
end = [ "tray", "notifications", "clipboard", "wallpaper", "volume", "control-center" ]
margin_ends = 0
radius = 0
radius_bottom_left = 12
radius_bottom_right = 12
start = [ "workspaces" ]
thickness = 32
widget_spacing = 12

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 540.0
    output = "VGA-1"
    rotation = 0.0
    type = "fancy_audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@WAYLAND-1", "lockscreen-login-box@VGA-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@VGA-1"]
    box_height = 229.0
    box_width = 720.0
    cx = 960.0
    cy = 961.0
    output = "VGA-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@VGA-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@WAYLAND-1"]
    box_height = 229.0
    box_width = 608.0
    cx = 320.0
    cy = 161.5
    output = "WAYLAND-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@WAYLAND-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_weather = true

[shell]
font_family = "Noto Sans"
password_style = "random"
polkit_agent = true

    [shell.panel]
    transparency_mode = "soft"

[theme]
builtin = "Tokyo-Night"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "niri", "starship" ]
    community_ids = [ "pywalfox", "vscode", "obs" ]

[widget.launcher]
glyph = "category-2"
scale = 1.6000000000000001

[widget.taskbar]
scale = 1.55

[widget.tray]
drawer = true
scale = 1.05

[widget.volume]
show_label = false

[widget.widget]
type = "oldirtty/color_picker:widget"
