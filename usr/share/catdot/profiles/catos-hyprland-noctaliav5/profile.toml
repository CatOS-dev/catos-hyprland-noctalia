schema = 4
name = "CatOS Hyprland Noctalia v5"
description = "CatOS Hyprland desktop powered by Noctalia v5"

packages = [
  "hyprland",
  "xdg-desktop-portal-gtk",
  "xdg-desktop-portal-hyprland",
  "noctalia",
  "cava",
  "adw-gtk-theme",
  "breeze",
  "breeze5",
  "breeze-gtk",
  "papirus-icon-theme",
  "qt6-multimedia",
  "wtype",
  "kitty",
  "brightnessctl",
  "playerctl",
  "wireplumber",
  "qt6ct-kde",
  "catos-bibata-cursor",
  "dconf",
  "nautilus",
  "gnome-keyring",
  "grim",
  "slurp",
  "swappy",
]

# Noctalia's generated outputs are intentionally NOT managed here; they are
# rewritten at runtime. Bootable seed snapshots are shipped next to them so a
# clean HOME can start before Noctalia runs for the first time:
#   .config/hypr/noctalia.lua
#   .config/gtk-3.0/noctalia.css
#   .config/gtk-4.0/noctalia.css
#   .config/kitty/themes/noctalia.conf
#   .config/qt6ct/colors/noctalia.conf
# The managed main Hyprland config loads the modular profile seeds from
# ~/.config/hypr/modules/. Those modules are installed once and are never
# managed, so later selections and updates preserve user edits.
manage = [
  ".config/dconf/all.ini",
  ".config/gtk-3.0/gtk.css",
  ".config/gtk-3.0/settings.ini",
  ".config/gtk-4.0/settings.ini",
  ".config/hypr/hyprland.lua",
  ".config/kitty/kitty.conf",
  ".config/noctalia/config.toml",
  ".config/qt6ct/qt6ct.conf",
  ".config/starship.toml",
]
