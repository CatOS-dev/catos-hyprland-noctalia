schema = 4
name = "CatOS Hyprland Noctalia"
description = "CatOS Hyprland desktop powered by Noctalia v5"

packages = [
  "hyprland",
  "xdg-desktop-portal-gtk",
  "xdg-desktop-portal-hyprland",
  "noctalia",
  "cava",
  "adw-gtk-theme",
  "breeze",
  "breeze5",
  "breeze-gtk",
  "papirus-icon-theme",
  "qt6-multimedia",
  "wtype",
  "kitty",
  "brightnessctl",
  "playerctl",
  "wireplumber",
  "qt6ct",
  "catos-bibata-cursor",
  "dconf",
  "nautilus",
]

manage = [
  ".config/dconf/all.ini",
  ".config/hypr/hyprland.lua",
  ".config/hypr/noctalia.lua",
  ".config/kitty/kitty.conf",
  ".config/kitty/themes/noctalia.conf",
  ".config/noctalia/noctalia-config.toml",
  ".config/qt6ct/qt6ct.conf",
  ".config/qt6ct/colors/noctalia.conf",
]
